<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="iceGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#80deea;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Circular dark background -->
  <circle cx="50" cy="50" r="48" fill="#112233" stroke="#80deea" stroke-width="1.5" />

  <!-- Frozen Power Line Wire -->
  <path d="M 5,25 Q 50,40 95,25" fill="none" stroke="#b0bec5" stroke-width="2.5" />
  <!-- Wire Ice Coating Highlight -->
  <path d="M 5,24 Q 50,39 95,24" fill="none" stroke="#ffffff" stroke-width="1" />

  <!-- Hanging Icicles -->
  <path d="M 20,29 L 23,55 L 26,29 
           M 35,32 L 37,45 L 39,32 
           M 48,34 L 52,70 L 56,34 
           M 68,31 L 70,50 L 73,30 
           M 80,28 L 82,42 L 84,27" 
        fill="url(#iceGlow)" stroke="#ffffff" stroke-width="0.8" />

  <!-- Freezing Rain Drops -->
  <path d="M 22,65 L 20,73 M 45,78 L 43,86 M 72,60 L 70,68" 
        stroke="#80deea" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
