<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Thermometer Fluid Gradient (Overheating Red/Orange) -->
    <linearGradient id="thermoFluid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="30%" stop-color="#DC2626"/>
      <stop offset="75%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- Glass Body Gradient -->
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#64748B"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Glass Highlight Gradient -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Heat Wave / Radiation Gradient -->
    <linearGradient id="heatGlowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Red Heat Glow Filter -->
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Heat Waves Rising From Top -->
    <g stroke="url(#heatGlowGrad)" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M 210 110 Q 190 70 215 30 T 200 -10"/>
      <path d="M 256 100 Q 276 60 256 25 T 270 -20"/>
      <path d="M 302 110 Q 322 70 297 30 T 312 -10"/>
    </g>

    <!-- Outer Glass Tube Shadow / Glow Backing -->
    <circle cx="256" cy="380" r="75" fill="#EF4444" opacity="0.25" filter="url(#redGlow)"/>

    <!-- Outer Glass Body (Tube & Bulb) -->
    <!-- Bulb Outer Base -->
    <circle cx="256" cy="380" r="68" fill="url(#glassBody)" stroke="#94A3B8" stroke-width="6"/>
    <!-- Vertical Tube Outer -->
    <rect x="220" y="90" width="72" height="260" rx="36" fill="url(#glassBody)" stroke="#94A3B8" stroke-width="6"/>
    <!-- Merge Tube and Bulb Inner Boundary -->
    <rect x="223" y="100" width="66" height="245" rx="33" fill="#1E293B"/>
    <circle cx="256" cy="380" r="62" fill="#1E293B"/>

    <!-- Fluid Column (Hot / Maxed Out) -->
    <circle cx="256" cy="380" r="50" fill="url(#thermoFluid)"/>
    <rect x="236" y="110" width="40" height="235" rx="20" fill="url(#thermoFluid)"/>

    <!-- Overflow / Heat Pressure Waves at Top of Mercury -->
    <path d="M 228 100 Q 256 80 284 100" stroke="#EF4444" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#redGlow)"/>
    <path d="M 216 82 Q 256 60 296 82" stroke="#F97316" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#redGlow)"/>

    <!-- Glass Reflection Highlights -->
    <rect x="228" y="110" width="12" height="210" rx="6" fill="url(#glassReflection)"/>
    <path d="M 218 355 A 52 52 0 0 1 235 330" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Measurement Ticks & High-Temp Indicators -->
    <!-- Low Ticks -->
    <line x1="300" y1="310" x2="315" y2="310" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <line x1="300" y1="270" x2="315" y2="270" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <!-- Mid Ticks -->
    <line x1="300" y1="230" x2="320" y2="230" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="300" y1="190" x2="320" y2="190" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <!-- Danger / High Ticks -->
    <line x1="300" y1="150" x2="325" y2="150" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
    <line x1="300" y1="115" x2="330" y2="115" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>

    <!-- Warning Exclamation Badge on Side -->
    <g transform="translate(340, 95)" filter="url(#redGlow)">
      <path d="M 22 0 L 44 38 L 0 38 Z" fill="#EF4444"/>
      <path d="M 22 5 L 38 33 L 6 33 Z" fill="#DC2626"/>
      <!-- Exclamation Mark -->
      <rect x="20" y="14" width="4" height="11" rx="2" fill="#FFFFFF"/>
      <circle cx="22" cy="29" r="2.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
