<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Cyan-yellow glow for the bolt, same technique as thunderstorm.svg -->
    <filter id="lightningGlow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="50" cy="50" r="48" fill="#112233" stroke="#b0bec5" stroke-width="1" />

  <!-- Detection-radius rings - distinguishes this from thunderstorm.svg's
       cloud+bolt+rain combo: this badge means "a tracked strike zone is
       nearby", not "a storm is directly overhead" -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- Bold, glowing lightning bolt -->
  <path d="M 47,15 L 28,55 L 44,55 L 36,88 L 74,42 L 54,42 L 62,15 Z"
        fill="#ffeb3b" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"
        filter="url(#lightningGlow)"/>
</svg>
