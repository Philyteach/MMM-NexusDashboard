<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Define the gradient for the aurora layers to create depth -->
    <linearGradient id="auroraGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" /> <!-- Bright Green -->
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:1" /> <!-- Cyan -->
      <stop offset="100%" style="stop-color:#8a2be2;stop-opacity:1" /><!-- Purple -->
    </linearGradient>
  </defs>
  
  <!-- Circular dark night-sky background -->
  <circle cx="50" cy="50" r="48" fill="#112233" />
  
  <!-- Flowing, layered aurora curtains -->
  <!-- Layer 1 (Back, Purple) -->
  <path d="M 15,35 Q 35,25 50,35 T 85,35 V 70 Q 65,80 50,70 T 15,70 Z" fill="#8a2be2" opacity="0.6"/>
  <!-- Layer 2 (Middle, Cyan) -->
  <path d="M 10,40 Q 30,30 50,40 T 90,40 V 75 Q 70,85 50,75 T 10,75 Z" fill="#00ffff" opacity="0.7"/>
  <!-- Layer 3 (Front, Green) -->
  <path d="M 5,45 Q 25,35 50,45 T 95,45 V 80 Q 75,90 50,80 T 5,80 Z" fill="#00ff00" />
  
  <!-- Soft stars for night context -->
  <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="35" cy="15" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="65" cy="18" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="80" cy="25" r="1.3" fill="#ffffff" opacity="0.7"/>
</svg>


