<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Circular container -->
  <circle cx="50" cy="50" r="48" fill="#112233" stroke="#00bcd4" stroke-width="1.5" />

  <!-- Dynamic Wind Gust Lines (Background) -->
  <path d="M 15,30 Q 35,15 60,30 T 90,30 M 10,50 Q 30,35 55,50 T 90,50 M 15,70 Q 35,55 60,70 T 85,70" 
        fill="none" stroke="#64b5f6" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Central Bold Snowflake -->
  <g transform="translate(50,50)" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
    <!-- 6 main arms -->
    <line x1="0" y1="-35" x2="0" y2="35" />
    <line x1="0" y1="-35" x2="0" y2="35" transform="rotate(60)"/>
    <line x1="0" y1="-35" x2="0" y2="35" transform="rotate(120)"/>
    
    <!-- Cross-bar details -->
    <path d="M -8,-22 L 0,-15 L 8,-22" fill="none"/>
    <path d="M -8,-22 L 0,-15 L 8,-22" fill="none" transform="rotate(60)"/>
    <path d="M -8,-22 L 0,-15 L 8,-22" fill="none" transform="rotate(120)"/>
    <path d="M -8,-22 L 0,-15 L 8,-22" fill="none" transform="rotate(180)"/>
    <path d="M -8,-22 L 0,-15 L 8,-22" fill="none" transform="rotate(240)"/>
    <path d="M -8,-22 L 0,-15 L 8,-22" fill="none" transform="rotate(300)"/>
  </g>
  
  <!-- Drifting Snowflakes -->
  <circle cx="22" cy="25" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="78" cy="72" r="2.5" fill="#b3e5fc" opacity="0.9"/>
  <circle cx="65" cy="18" r="1.8" fill="#ffffff" opacity="0.7"/>
</svg>
