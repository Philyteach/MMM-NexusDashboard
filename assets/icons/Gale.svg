<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Wave-like layering gradient for the driving wind gusts -->
    <linearGradient id="galeWind" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" /> <!-- Bright Cyan -->
      <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:0.3" /> <!-- Fade -->
    </linearGradient>
  </defs>

  <!-- Circular container background (Cold Night Sky) -->
  <circle cx="50" cy="50" r="48" fill="#112233" stroke="#b0bec5" stroke-width="1" />

  <!-- Layered, Dynamic Driving Wind Gusts (Upper Background) -->
  <path d="M 15,30 Q 35,15 60,30 T 95,25 V 50 Q 70,60 50,50 T 10,50 Z" fill="url(#galeWind)" opacity="0.6"/>
  <path d="M 5,45 Q 25,35 50,45 T 98,40 V 60 Q 75,70 50,60 T 5,60 Z" fill="url(#galeWind)" opacity="0.8"/>

  <!-- Swirling Wind Vortex (Lower Background) -->
  <path d="M 60,70 A 15,15 0 1,1 90,70 A 15,15 0 0,1 60,70 Z" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="10,8" opacity="0.6"/>

  <!-- The Severely Bent Tree (High Visibility) -->
  <g transform="translate(5,0)">
    <!-- Severely Angled Trunk -->
    <path d="M 30,85 C 32,80 32,75 35,60 C 40,40 55,30 65,25 L 68,28 C 58,33 45,43 40,63 C 37,78 37,83 35,85 H 30 Z" fill="#8d6e63" stroke="#4e342e" stroke-width="1"/>
    
    <!-- Oppressive Bent Foliage -->
    <path d="M 65,25 Q 80,10 90,25 Q 98,40 85,50 Q 70,60 60,50 Z" fill="#66bb6a" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 55,35 Q 70,20 80,35 Q 88,50 75,60 Q 60,70 50,60 Z" fill="#aed581" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Dynamic Bent Branches Detail -->
    <path d="M 40,63 L 55,55 M 37,78 L 48,73" stroke="#4e342e" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Dust/Debris particles being driven -->
  <circle cx="82" cy="72" r="1.5" fill="#ffffff" opacity="0.7"/>
  <rect x="75" y="18" width="5" height="2" fill="#d7ccc8" transform="rotate(-15 77 19)"/>
</svg>
